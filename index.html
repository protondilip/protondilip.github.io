<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        /* ========== RESET & CORE ========== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
            color: #e0e0e0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ========== CONTAINER ========== */
        .app-drawer {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;
            min-height: 100%;
        }

        /* Header Section */
        .header {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 2;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ========== GRID LAYOUT ========== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 480px;
            height: fit-content;
            margin-top: 40px;
        }

        /* ========== CARD STYLING ========== */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .app-item a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            outline: none;
            position: relative;
        }

        /* ========== ICON STYLING ========== */
        .icon-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 600;
            color: #ffffff;
            background-color: #1a1f3a;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .icon-placeholder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.1) 100%);
            border-radius: 20px;
            pointer-events: none;
        }

        /* Hover effect */
        .app-item a:hover .icon-placeholder,
        .app-item a:focus .icon-placeholder {
            transform: translateY(-8px) scale(1.05);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 16px 48px rgba(99, 102, 241, 0.2),
                        0 0 20px rgba(99, 102, 241, 0.1);
        }

        /* ========== APP NAME ========== */
        .app-name {
            font-size: 12px;
            font-weight: 500;
            word-wrap: break-word;
            overflow-wrap: break-word;
            width: 85px;
            color: #b0b0b0;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
        }

        .app-item a:hover .app-name,
        .app-item a:focus .app-name {
            color: #e0e0e0;
        }

        /* ========== COLOR PALETTE ========== */
        /* Social Media */
        .icon-linkedin { background: linear-gradient(135deg, #0A66C2, #0a4f96); }
        .icon-facebook { background: linear-gradient(135deg, #1877F2, #1a5cdb); }
        .icon-instagram { background: conic-gradient(from 45deg, #fd5949, #d6249f, #285AEB, #fd5949); }
        .icon-reddit { background: linear-gradient(135deg, #FF4500, #d93900); }
        .icon-threads { background: linear-gradient(135deg, #000000, #1a1a1a); }
        .icon-x { background: linear-gradient(135deg, #000000, #1a1a1a); }
        .icon-youtube { background: linear-gradient(135deg, #ee0000, #c41e00); }

        /* AI Platforms */
        .icon-gemini { background: conic-gradient(from 45deg, #4285F4, #9B72CB, #D96570, #F2A60F, #4285F4); }
        .icon-aistudio { background: linear-gradient(135deg, #1a73e8, #1557b0); }
        .icon-grok { background: linear-gradient(135deg, #1DA1F2, #1a7ab8); }
        .icon-claude { background: linear-gradient(135deg, #AE8FDB, #8b6bb6); }
        .icon-chatgpt { background: linear-gradient(135deg, #75A99F, #5a8680); }
        .icon-deepseek { background: linear-gradient(135deg, #19C37D, #14a85f); }
        .icon-copilot { background: linear-gradient(135deg, #00A1F1, #0080b8); }
        .icon-lechat { background: linear-gradient(135deg, #FD650B, #da5509); }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .app-drawer {
                padding: 80px 15px 40px;
            }

            .grid-container {
                grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
                gap: 14px;
            }

            .icon-placeholder {
                width: 70px;
                height: 70px;
                font-size: 24px;
                border-radius: 16px;
                margin-bottom: 10px;
            }

            .app-name {
                font-size: 11px;
                width: 75px;
            }

            .header h1 {
                font-size: 22px;
            }
        }

        @media (max-width: 360px) {
            .app-drawer {
                padding: 70px 10px 30px;
            }

            .grid-container {
                grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
                gap: 12px;
            }

            .icon-placeholder {
                width: 60px;
                height: 60px;
                font-size: 20px;
                border-radius: 14px;
                margin-bottom: 8px;
            }

            .app-name {
                font-size: 10px;
                width: 65px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 10px;
            }
        }

    </style>
</head>
<body>

    <main class="app-drawer">
        <div class="header">
            <h1>Portal</h1>
            <p>Your Digital Ecosystem</p>
        </div>

        <div class="grid-container">

            <div class="app-item">
                <a href="https://www.linkedin.com/" target="_blank">
                    <div class="icon-placeholder icon-linkedin">Li</div>
                    <span class="app-name">LinkedIn</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://www.facebook.com/" target="_blank">
                    <div class="icon-placeholder icon-facebook">Fb</div>
                    <span class="app-name">Facebook</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://www.instagram.com/" target="_blank">
                    <div class="icon-placeholder icon-instagram">Ig</div>
                    <span class="app-name">Instagram</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://www.reddit.com/" target="_blank">
                    <div class="icon-placeholder icon-reddit">Re</div>
                    <span class="app-name">Reddit</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://m.youtube.com/" target="_blank">
                    <div class="icon-placeholder icon-youtube">Yu</div>
                    <span class="app-name">Youtube</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://www.threads.net/" target="_blank">
                    <div class="icon-placeholder icon-threads">Th</div>
                    <span class="app-name">Threads</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://x.com/" target="_blank">
                    <div class="icon-placeholder icon-x">X</div>
                    <span class="app-name">X</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://gemini.google.com/" target="_blank">
                    <div class="icon-placeholder icon-gemini">Ge</div>
                    <span class="app-name">Gemini</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://aistudio.google.com/" target="_blank">
                    <div class="icon-placeholder icon-aistudio">AI</div>
                    <span class="app-name">AI Studio</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://grok.x.ai/" target="_blank">
                    <div class="icon-placeholder icon-grok">Gr</div>
                    <span class="app-name">Grok</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://claude.ai/" target="_blank">
                    <div class="icon-placeholder icon-claude">Cl</div>
                    <span class="app-name">Claude</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://chat.openai.com/" target="_blank">
                    <div class="icon-placeholder icon-chatgpt">GPT</div>
                    <span class="app-name">ChatGPT</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://chat.deepseek.com/" target="_blank">
                    <div class="icon-placeholder icon-deepseek">DS</div>
                    <span class="app-name">DeepSeek</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://copilot.microsoft.com/" target="_blank">
                    <div class="icon-placeholder icon-copilot">Co</div>
                    <span class="app-name">Copilot</span>
                </a>
            </div>

            <div class="app-item">
                <a href="https://chat.mistral.ai/" target="_blank">
                    <div class="icon-placeholder icon-lechat">LC</div>
                    <span class="app-name">Le Chat</span>
                </a>
            </div>

        </div>
    </main>

</body>
</html>
