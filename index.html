<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080f;
      --surface: #0d0f1c;
      --border: rgba(255,255,255,0.07);
      --text-dim: #4a4d6a;
      --text-mid: #8a8da8;
      --text-bright: #e2e4f0;
      --accent: #5b5fef;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-bright);
      overflow-x: hidden;
    }

    /* ── NOISE TEXTURE ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.6;
    }

    /* ── AMBIENT GLOW ── */
    .glow-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.12;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .glow-orb:nth-child(1) { width: 500px; height: 500px; background: #5b5fef; top: -150px; left: -100px; animation-delay: 0s; }
    .glow-orb:nth-child(2) { width: 400px; height: 400px; background: #a855f7; bottom: -100px; right: -80px; animation-delay: -6s; }
    .glow-orb:nth-child(3) { width: 300px; height: 300px; background: #ec4899; top: 40%; left: 40%; animation-delay: -12s; opacity: 0.07; }

    @keyframes drift {
      0%   { transform: translate(0,0) scale(1); }
      50%  { transform: translate(30px, -20px) scale(1.05); }
      100% { transform: translate(-20px, 30px) scale(0.95); }
    }

    /* ── LAYOUT ── */
    .wrapper {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; align-items: center;
      padding: 56px 20px 60px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      margin-bottom: 44px;
      animation: fadeUp 0.6s ease both;
    }

    .wordmark {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 0%, #a0a3c4 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-dim);
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      width: 100%;
      max-width: 520px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 0 4px;
      margin-bottom: 12px;
      animation: fadeUp 0.6s ease both;
    }

    .section-label + .section-label { margin-top: 28px; }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 520px;
      margin-bottom: 4px;
    }

    /* ── APP TILE ── */
    .tile {
      position: relative;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 8px 14px;
      gap: 10px;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1),
                  border-color 0.2s ease,
                  box-shadow 0.2s ease;
      animation: fadeUp 0.5s ease both;
      -webkit-tap-highlight-color: transparent;
    }

    /* stagger each tile in */
    .tile:nth-child(1)  { animation-delay: 0.04s; }
    .tile:nth-child(2)  { animation-delay: 0.08s; }
    .tile:nth-child(3)  { animation-delay: 0.12s; }
    .tile:nth-child(4)  { animation-delay: 0.16s; }
    .tile:nth-child(5)  { animation-delay: 0.20s; }
    .tile:nth-child(6)  { animation-delay: 0.24s; }
    .tile:nth-child(7)  { animation-delay: 0.28s; }
    .tile:nth-child(8)  { animation-delay: 0.32s; }

    /* glow stripe at top */
    .tile::before {
      content: '';
      position: absolute;
      top: 0; left: 20%; right: 20%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
      border-radius: 999px;
    }

    /* color bleed on hover */
    .tile::after {
      content: '';
      position: absolute; inset: 0;
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 18px;
    }

    .tile:hover::after  { opacity: 1; }
    .tile:active        { transform: scale(0.95) !important; }

    .tile:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: rgba(255,255,255,0.14);
      box-shadow: 0 20px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* ── ICON SHELL ── */
    .icon-wrap {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: box-shadow 0.2s ease;
    }

    .icon-wrap svg { width: 28px; height: 28px; display: block; }

    .tile:hover .icon-wrap {
      box-shadow: 0 8px 24px var(--tile-glow, rgba(91,95,239,0.4));
    }

    /* ── LABEL ── */
    .tile-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-mid);
      letter-spacing: 0.2px;
      transition: color 0.2s ease;
      text-align: center;
      line-height: 1.2;
    }

    .tile:hover .tile-label { color: var(--text-bright); }

    /* ── BRAND COLORS ── */
    .t-linkedin   { --tile-glow: rgba(10,102,194,0.5);  }
    .t-facebook   { --tile-glow: rgba(24,119,242,0.5);  }
    .t-instagram  { --tile-glow: rgba(214,36,159,0.5);  }
    .t-reddit     { --tile-glow: rgba(255,69,0,0.5);    }
    .t-youtube    { --tile-glow: rgba(238,0,0,0.5);     }
    .t-threads    { --tile-glow: rgba(100,100,100,0.4); }
    .t-x          { --tile-glow: rgba(150,150,150,0.3); }
    .t-gemini     { --tile-glow: rgba(66,133,244,0.5);  }
    .t-aistudio   { --tile-glow: rgba(26,115,232,0.5);  }
    .t-grok       { --tile-glow: rgba(150,150,150,0.3); }
    .t-claude     { --tile-glow: rgba(174,143,219,0.5); }
    .t-chatgpt    { --tile-glow: rgba(117,169,159,0.5); }
    .t-deepseek   { --tile-glow: rgba(25,195,125,0.5);  }
    .t-copilot    { --tile-glow: rgba(0,161,241,0.5);   }
    .t-lechat     { --tile-glow: rgba(253,101,11,0.5);  }

    .icon-linkedin  { background: linear-gradient(135deg, #0A66C2, #064d94); }
    .icon-facebook  { background: linear-gradient(135deg, #1877F2, #1464d0); }
    .icon-instagram { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .icon-reddit    { background: linear-gradient(135deg, #FF4500, #c93600); }
    .icon-youtube   { background: linear-gradient(135deg, #FF0000, #c00); }
    .icon-threads   { background: linear-gradient(135deg, #101010, #2a2a2a); }
    .icon-x         { background: linear-gradient(135deg, #0f0f0f, #222); }
    .icon-gemini    { background: linear-gradient(135deg, #1a73e8, #7b2ff7); }
    .icon-aistudio  { background: linear-gradient(135deg, #1557b0, #1a73e8); }
    .icon-grok      { background: linear-gradient(135deg, #111, #333); }
    .icon-claude    { background: linear-gradient(135deg, #8b6bb6, #ae8fdb); }
    .icon-chatgpt   { background: linear-gradient(135deg, #10a37f, #1dc48f); }
    .icon-deepseek  { background: linear-gradient(135deg, #0d6fd8, #4aa3ff); }
    .icon-copilot   { background: linear-gradient(135deg, #005fb8, #00a4ef); }
    .icon-lechat    { background: linear-gradient(135deg, #FD650B, #ff8c42); }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── DIVIDER ── */
    .divider {
      width: 100%; max-width: 520px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 28px 0 20px;
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 40px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: fadeUp 0.6s 0.5s ease both;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 440px) {
      .wrapper { padding: 44px 14px 48px; }
      .grid    { grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 380px; }
      .icon-wrap { width: 44px; height: 44px; border-radius: 12px; }
      .icon-wrap svg { width: 24px; height: 24px; }
      .tile    { padding: 14px 6px 11px; border-radius: 14px; gap: 8px; }
      .tile-label { font-size: 10px; }
      .wordmark { font-size: 26px; }
      .section-label { max-width: 380px; }
      .divider { max-width: 380px; }
    }

    @media (max-width: 340px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
